server:
  port: 8080

spring:
  application:
    name: fhirstorm-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fhirstorm}
    username: ${SPRING_DATASOURCE_USERNAME:fhiruser}
    password: ${SPRING_DATASOURCE_PASSWORD:fhirpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.fhirstorm: DEBUG
    ca.uhn.hapi.fhir: INFO
